<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Participe do Grupo do Jota e receba análises todos os dias."
    />
    <meta name="theme-color" content="#1c92d2" />
    <title>ENTRADA LIBERADA</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2393cde6' stroke='%231c92d2' stroke-width='4'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='Arial' font-size='25' font-weight='900' fill='%23ffffff'%3EJC%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --blue-900: #0b4f75;
        --blue-700: #1c92d2;
        --blue-600: #45a7db;
        --blue-500: #6dbae3;
        --blue-300: #93cde6;
        --blue-200: #c0e3f4;
        --blue-100: #edf8fc;
        --white: #ffffff;
        --muted: rgb(237 248 252 / 78%);
        --line: rgb(192 227 244 / 28%);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--blue-900);
      }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        overflow-x: hidden;
        color: var(--white);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background-image:
          linear-gradient(180deg, rgb(28 146 210 / 58%), rgb(11 79 117 / 90%)),
          url("https://comunidadejc-es.vercel.app/field-pop-art.png");
        background-position: center;
        background-size: cover;
        background-attachment: fixed;
        background-blend-mode: color, normal;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 34%, rgb(192 227 244 / 32%), transparent 39%),
          linear-gradient(90deg, rgb(11 79 117 / 58%), transparent 24% 76%, rgb(11 79 117 / 58%)),
          linear-gradient(180deg, rgb(28 146 210 / 8%), rgb(11 79 117 / 58%));
      }

      a {
        color: inherit;
      }

      .page {
        position: relative;
        display: grid;
        width: 100%;
        min-height: 100svh;
        grid-template-rows: minmax(0, 1fr) auto;
        isolation: isolate;
      }

      .hero {
        position: relative;
        display: grid;
        min-height: 0;
        place-items: center;
        padding:
          max(1rem, env(safe-area-inset-top))
          max(1rem, env(safe-area-inset-right))
          max(1.25rem, env(safe-area-inset-bottom))
          max(1rem, env(safe-area-inset-left));
        text-align: center;
      }

      .hero-inner {
        position: relative;
        z-index: 3;
        display: grid;
        width: min(92vw, 760px);
        justify-items: center;
        gap: clamp(0.75rem, 1.8vh, 1rem);
      }

      .title-stage {
        display: grid;
        width: min(100%, 740px);
        justify-items: center;
        gap: clamp(0.25rem, 0.8vh, 0.5rem);
        padding: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
        transform: translateY(-0.8rem);
      }

      .eyebrow {
        margin: 0;
        color: var(--blue-200);
        font-size: clamp(0.68rem, 1.6vw, 0.8rem);
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .hero-title {
        display: grid;
        margin: 0;
        color: var(--white);
        font-family: Midstar, Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        font-size: clamp(4.1rem, 13vw, 9.2rem);
        font-weight: 900;
        font-style: italic;
        line-height: 0.78;
        letter-spacing: -0.045em;
        text-transform: uppercase;
        text-wrap: balance;
        filter:
          drop-shadow(0 10px 0 rgb(11 79 117 / 66%))
          drop-shadow(0 0 24px rgb(147 205 230 / 30%));
      }

      .title-line {
        display: block;
        white-space: nowrap;
      }

      .title-line:last-child {
        margin-top: 0.14em;
        color: var(--blue-200);
      }

      .js .title-letter {
        display: inline-block;
        opacity: 0;
        transform: translateY(0.42em) scale(0.82) rotate(3deg);
        filter: blur(7px);
      }

      .js .title-visible .title-letter {
        animation: letter-in 0.38s cubic-bezier(0.18, 0.78, 0.25, 1.12) forwards;
        animation-delay: var(--reveal-delay, 0ms);
      }

      .kickoff-ball {
        position: fixed;
        top: 46%;
        left: -92vmin;
        z-index: 5;
        display: none;
        width: min(88vw, 88svh);
        max-width: 980px;
        height: auto;
        pointer-events: none;
        filter: drop-shadow(0 24px 22px rgb(4 31 47 / 62%));
        will-change: transform, opacity;
      }

      .js .kickoff-ball {
        display: block;
      }

      .js .scene-start .kickoff-ball {
        animation: ball-cross 2.25s cubic-bezier(0.28, 0.06, 0.2, 1) both;
      }

      .conversion-content {
        display: grid;
        width: 100%;
        justify-items: center;
        gap: clamp(1.8rem, 4vh, 2.65rem);
        margin-top: clamp(2.25rem, 5vh, 4rem);
      }

      .glass-card {
        width: min(100%, 620px);
        padding: clamp(0.9rem, 2.7vw, 1.15rem) clamp(1rem, 3.4vw, 1.4rem);
        border: 1px solid rgb(192 227 244 / 40%);
        border-radius: 1.15rem;
        background: linear-gradient(145deg, rgb(192 227 244 / 24%), rgb(69 167 219 / 13%));
        box-shadow:
          inset 0 1px 0 rgb(237 248 252 / 35%),
          0 18px 45px rgb(11 79 117 / 34%);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .subtitle {
        margin: 0;
        color: rgb(255 255 255 / 94%);
        font-size: clamp(1rem, 2.3vw, 1.16rem);
        font-weight: 400;
        line-height: 1.45;
      }

      .subtitle strong {
        color: var(--blue-200);
        font-weight: 800;
      }

      .cta-wrap {
        display: grid;
        width: min(100%, 520px);
        justify-items: center;
        gap: 0.85rem;
      }

      .cta {
        display: inline-flex;
        width: 100%;
        min-height: 4rem;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        padding: 0.8rem 1.2rem;
        border: 1px solid rgb(237 248 252 / 42%);
        border-radius: 1rem;
        background: linear-gradient(180deg, var(--blue-600), var(--blue-700));
        box-shadow:
          0 5px 0 var(--blue-900),
          0 15px 36px rgb(11 79 117 / 46%),
          inset 0 1px 0 rgb(237 248 252 / 48%);
        color: #fff;
        font-size: clamp(0.98rem, 2.7vw, 1.22rem);
        font-weight: 900;
        letter-spacing: 0.035em;
        text-decoration: none;
        text-transform: uppercase;
        animation: float 2.8s ease-in-out infinite;
        transition: filter 160ms ease, transform 160ms ease;
      }

      .cta:hover {
        filter: brightness(1.08);
      }

      .cta:active {
        transform: translateY(4px);
        box-shadow:
          0 1px 0 var(--blue-900),
          0 9px 20px rgb(11 79 117 / 38%);
      }

      .cta:focus-visible {
        outline: 3px solid var(--blue-200);
        outline-offset: 4px;
      }

      .telegram-icon {
        width: 1.75rem;
        height: 1.75rem;
        flex: 0 0 auto;
        fill: currentColor;
      }

      .legal-note {
        margin: 0;
        color: var(--muted);
        font-size: clamp(0.69rem, 1.55vw, 0.75rem);
        line-height: 1.45;
      }

      .legal-note a {
        font-weight: 750;
        text-underline-offset: 0.18em;
      }

      .footer {
        position: relative;
        z-index: 4;
        display: grid;
        justify-items: center;
        gap: 0.65rem;
        padding: 0.65rem 1rem 0.8rem;
        border-top: 1px solid rgb(192 227 244 / 16%);
        background: rgb(4 30 43 / 96%);
        text-align: center;
        overflow: hidden;
      }

      .legal-seal {
        display: block;
        width: min(100%, 1080px);
        height: auto;
        margin: 0;
      }

      .footer-links {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        margin: 0;
        color: rgb(237 248 252 / 76%);
        font-size: clamp(0.72rem, 1.45vw, 0.88rem);
        line-height: 1.2;
      }

      .footer-links a {
        text-decoration: none;
        transition: color 160ms ease;
      }

      .footer-links a:hover {
        color: var(--white);
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      .footer-links a:focus-visible {
        outline: 2px solid var(--blue-200);
        outline-offset: 3px;
      }

      @keyframes ball-cross {
        0% {
          opacity: 0;
          transform: translate3d(0, -48%, 0) rotate(-24deg) scale(0.96);
        }

        6%,
        90% {
          opacity: 1;
        }

        25% {
          transform: translate3d(calc(25vw + 46vmin), -52%, 0) rotate(230deg) scale(1);
        }

        50% {
          transform: translate3d(calc(50vw + 92vmin), -48%, 0) rotate(490deg) scale(1.015);
        }

        75% {
          transform: translate3d(calc(75vw + 138vmin), -51%, 0) rotate(745deg) scale(1);
        }

        100% {
          opacity: 0;
          transform: translate3d(calc(100vw + 184vmin), -48%, 0) rotate(1000deg) scale(0.97);
        }
      }

      @keyframes letter-in {
        to {
          opacity: 1;
          transform: translateY(0) scale(1) rotate(0);
          filter: blur(0);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow:
            0 4px 0 var(--blue-900),
            0 10px 24px rgb(11 79 117 / 38%),
            0 0 0 0 rgb(147 205 230 / 38%);
        }
        50% {
          transform: scale(1.045);
          box-shadow:
            0 4px 0 var(--blue-900),
            0 14px 30px rgb(11 79 117 / 48%),
            0 0 0 10px rgb(147 205 230 / 0%);
        }
      }

      @media (max-width: 620px) {
        .hero {
          display: grid;
          align-items: stretch;
          justify-items: center;
          padding-top: max(1.5rem, env(safe-area-inset-top));
          padding-inline: 0.85rem;
          padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }

        .hero-inner {
          position: relative;
          display: grid;
          width: min(94vw, 520px);
          height: 100%;
          margin-inline: auto;
          grid-template-rows: minmax(0, 1fr) auto;
          align-items: center;
          justify-items: center;
          transform: translateX(clamp(-10px, -2vw, -6px));
        }

        .title-stage {
          position: static;
          width: min(98vw, 540px);
          gap: 0.2rem;
          padding: 0;
          transform: none;
        }

        .hero-title {
          width: 100%;
          font-size: clamp(4rem, 20vw, 6.8rem);
          line-height: 0.78;
        }

        .glass-card {
          border-radius: 0.95rem;
        }

        .conversion-content {
          position: static;
          width: min(92vw, 520px);
          gap: clamp(1.9rem, 4.6vh, 2.4rem);
          margin: 0 0 3.6rem;
          transform: none;
        }

        .cta-wrap {
          width: min(94vw, 410px);
        }

        .legal-note {
          width: 100%;
          font-size: clamp(0.56rem, 2.35vw, 0.66rem);
          line-height: 1.25;
          white-space: nowrap;
        }

        .cta {
          width: min(82vw, 360px);
          min-height: 3.25rem;
          padding: 0.65rem 1rem;
          border-radius: 0.9rem;
          font-size: clamp(0.86rem, 3.8vw, 1rem);
          animation: pulse 1.35s ease-in-out infinite;
        }

        .telegram-icon {
          width: 1.45rem;
          height: 1.45rem;
        }

        .js .scene-start .kickoff-ball {
          animation-duration: 1.7s;
        }

        .footer {
          gap: 0.48rem;
          padding: 0 0.2rem 0.55rem;
          border-top: 0;
        }

        .legal-seal {
          width: calc(100% + 0.4rem);
          max-width: none;
          margin-inline: -0.2rem;
        }

        .footer-links {
          gap: 0.52rem;
          font-size: clamp(0.66rem, 2.8vw, 0.76rem);
        }
      }

      @media (max-width: 620px) and (max-height: 760px) {
        .hero {
          min-height: 0;
          padding-block: 1.1rem;
        }

        .conversion-content {
          gap: 1.35rem;
          margin-bottom: 2.1rem;
        }
      }

      @media (min-width: 621px) and (max-height: 720px) {
        .hero {
          min-height: auto;
          padding-block: 2.4rem;
        }

        .page {
          min-height: 100svh;
        }

        .footer {
          margin-top: auto;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .kickoff-ball {
          display: none !important;
        }

        .title-letter {
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
          animation: none !important;
        }

        .cta {
          animation: none;
        }
      }
    </style>
    <script>
      document.documentElement.classList.add("js");
    </script>
  </head>
  <body>
    <div class="page">
      <main class="hero">
        <img
          class="kickoff-ball"
          src="https://comunidadejc-es.vercel.app/football-single.png"
          width="1254"
          height="1254"
          alt=""
          aria-hidden="true"
        />

        <section class="hero-inner" aria-labelledby="main-title">
          <div class="title-stage">
            <p class="eyebrow">Análises todos os dias</p>

            <h1 id="main-title" class="hero-title" aria-label="Entrada Liberada">
              <span class="title-line">ENTRADA</span>
              <span class="title-line">LIBERADA</span>
            </h1>
          </div>

          <div class="conversion-content">
            <div class="glass-card">
              <p class="subtitle">
                Participe agora do meu <strong>grupo gratuito</strong>, onde libero
                minhas análises todos os dias.
              </p>
            </div>

            <div class="cta-wrap">
              <a
                class="cta"
                href="https://www.estrelabet.bet.br/"
                aria-label="Entrar no grupo"
              >
                <svg class="telegram-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 0C5.372 0 0 5.373 0 12s5.372 12 12 12 12-5.373 12-12S18.628 0 12 0Zm5.894 8.221-1.97 9.279c-.145.658-.537.818-1.084.51l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.334-.373-.121l-6.871 4.326-2.962-.924c-.642-.203-.657-.642.136-.953l11.57-4.461c.536-.194 1.006.131.833.941Z" />
                </svg>
                <span>ENTRAR NO GRUPO</span>
              </a>

              <p class="legal-note">
                Ao clicar no botão você concorda com nossos
                <a href="https://lp-comunidade-one.vercel.app/termos-de-uso.html">Termos</a>
                e
                <a href="https://lp-comunidade-one.vercel.app/politica-de-privacidade.html">Políticas</a>
              </p>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <img
          class="legal-seal"
          src="EB_Selo-Legal_4-5_1.png"
          width="1080"
          height="137"
          alt="Ministério da Fazenda adverte: Aposta não é investimento. Jogue com responsabilidade. Autorização SPA/MF nº 320/2025."
        />
        <nav class="footer-links" aria-label="Links legais">
          <a href="https://lp-comunidade-one.vercel.app/termos-de-uso.html">Termos de Uso</a>
          <span aria-hidden="true">|</span>
          <a href="https://lp-comunidade-one.vercel.app/politica-de-privacidade.html">Política de Privacidade</a>
        </nav>
      </footer>
    </div>

    <script>
      (() => {
        const title = document.querySelector(".hero-title");
        const lines = [...title.querySelectorAll(".title-line")];

        for (const line of lines) {
          const characters = [...line.textContent];
          line.textContent = "";

          for (const character of characters) {
            const letter = document.createElement("span");
            letter.className = "title-letter";
            letter.textContent = character === " " ? "\u00a0" : character;
            line.appendChild(letter);
          }
        }

        requestAnimationFrame(() => {
          const isMobile = window.matchMedia("(max-width: 620px)").matches;
          const titleBounds = title.getBoundingClientRect();
          const letters = [...title.querySelectorAll(".title-letter")];
          const revealSpan = isMobile ? 350 : 500;

          for (const letter of letters) {
            const letterBounds = letter.getBoundingClientRect();
            const horizontalPosition =
              (letterBounds.left + letterBounds.width / 2 - titleBounds.left) /
              titleBounds.width;
            const delay = Math.max(0, Math.round(horizontalPosition * revealSpan));
            letter.style.setProperty("--reveal-delay", `${delay}ms`);
          }

          document.body.classList.add("scene-start");

          window.setTimeout(() => {
            title.classList.add("title-visible");
          }, isMobile ? 280 : 440);
        });
      })();
    </script>
  </body>
</html>
