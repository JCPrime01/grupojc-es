    <script>
      (() => {
        const title = document.querySelector(".hero-title");
        const lines = [...title.querySelectorAll(".title-line")];

        for (const line of lines) {
          const characters = [...line.textContent];
          line.textContent = "";

          for (const character of characters) {
            const letter = document.createElement("span");
            letter.className = "title-letter";
            letter.textContent = character === " " ? "\u00a0" : character;
            line.appendChild(letter);
          }
        }

        requestAnimationFrame(() => {
          const isMobile = window.matchMedia("(max-width: 620px)").matches;
          const titleBounds = title.getBoundingClientRect();
          const letters = [...title.querySelectorAll(".title-letter")];
          const revealSpan = isMobile ? 350 : 500;

          for (const letter of letters) {
            const letterBounds = letter.getBoundingClientRect();
            const horizontalPosition =
              (letterBounds.left + letterBounds.width / 2 - titleBounds.left) /
              titleBounds.width;
            const delay = Math.max(0, Math.round(horizontalPosition * revealSpan));
            letter.style.setProperty("--reveal-delay", `${delay}ms`);
          }

          document.body.classList.add("scene-start");

          window.setTimeout(() => {
            title.classList.add("title-visible");
          }, isMobile ? 280 : 440);
        });
      })();
    </script>

    <script>
      (function () {
        var TRACK_HOST = 'track.grupojc.cc';
        var UTM_KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','campaign','fbclid','gclid','cid','account_id','bot'];

        function mergeTrackingParams(href) {
          var params = new URLSearchParams(window.location.search);
          var url = new URL(href);
          UTM_KEYS.forEach(function (k) {
            var v = params.get(k);
            if (v) url.searchParams.set(k, v);
          });
          if (url.hostname === TRACK_HOST) {
            var fbp = document.cookie.match(/(?:^|; )_fbp=([^;]+)/);
            var fbc = document.cookie.match(/(?:^|; )_fbc=([^;]+)/);
            if (fbp) url.searchParams.set('fbp', decodeURIComponent(fbp[1]));
            if (fbc) {
              url.searchParams.set('fbc', decodeURIComponent(fbc[1]));
            } else if (params.get('fbclid')) {
              url.searchParams.set('fbc', 'fb.1.' + Date.now() + '.' + params.get('fbclid'));
            }
          }
          return url;
        }

        function handleCtaClick(e) {
          try {
            var anchor = e.currentTarget;
            var baseHref = anchor.getAttribute('data-href') || anchor.href;
            var url = mergeTrackingParams(baseHref);
            try {
              if (typeof window.dispararLead === 'function') {
                var eid = window.dispararLead();
                if (eid && url.hostname === TRACK_HOST) url.searchParams.set('eid', eid);
              }
            } catch (err) { /* ignore */ }
            anchor.href = url.toString();
          } catch (err) { /* ignore */ }
        }

        document.querySelectorAll('.cta, .alternative-cta').forEach(function (a) {
          a.addEventListener('click', handleCtaClick);
        });
      })();
    </script>
